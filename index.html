<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SutharLabs Developer Platform</title>
    <!-- Google Fonts & Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      body {
        background-color: #050505;
        margin: 0;
        font-family: 'Inter', sans-serif;
      }
    </style>
    <!-- Theme flash prevention: runs synchronously before React to avoid FOUC -->
    <script>
      (function() {
        var saved = localStorage.getItem('sutharlabs_theme');
        var theme = (saved === 'light' || saved === 'dark') ? saved : 'light';
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      })();
    </script>
  </head>
  <body class="bg-[#050505] text-[#e5e1e4]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
