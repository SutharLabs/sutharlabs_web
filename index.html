<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SutharLabs Developer Platform</title>
    <!-- Google Fonts & Material Icons: preconnect and display=block for icon font prevents FOUT text flash -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet" />
    <style>
      body {
        background-color: #050505;
        margin: 0;
        font-family: 'Inter', sans-serif;
      }
      /* Prevent Material Symbols ligature text from wrapping vertically or causing CLS */
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
        overflow: visible;
        vertical-align: middle;
        user-select: none;
      }
      /* Suppress raw ligature words before webfont finishes loading without layout shift */
      html:not(.fonts-ready) .material-symbols-outlined {
        color: transparent !important;
        visibility: hidden;
      }
    </style>
    <script>
      if ('fonts' in document) {
        Promise.race([
          document.fonts.load('24px "Material Symbols Outlined"'),
          document.fonts.ready,
          new Promise(function(resolve) { setTimeout(resolve, 800); })
        ]).then(function() {
          document.documentElement.classList.add('fonts-ready');
        });
      } else {
        document.documentElement.classList.add('fonts-ready');
      }
    </script>
    <!-- Suppress harmless third-party extension and browser telemetry errors (e.g. Chrome Web Vitals / MetaMask shims) -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes("reading 'startTime'") || e.message.includes('MetaMask'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).includes('MetaMask') || String(e.reason).includes('startTime'))) {
          e.preventDefault();
        }
      });
    </script>
    <!-- Theme flash prevention: runs synchronously before React to avoid FOUC -->
    <script>
      (function() {
        var saved = localStorage.getItem('sutharlabs_theme');
        var theme = (saved === 'light' || saved === 'dark') ? saved : 'light';
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      })();
    </script>
  </head>
  <body class="bg-[#050505] text-[#e5e1e4]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
